name: parity-tests

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint parity manifest
        run: |
          set -euo pipefail
          python3 scripts/parity/lint_manifest.py \
            --manifest test/parity/manifest.tsv \
            --rules test/parity/rules.tsv \
            --allowlist test/parity/cts_allowlist.tsv \
            --blocklist test/parity/cts_blocklist.tsv

      - name: Check oracle normalization drift
        run: |
          set -euo pipefail
          python3 scripts/parity/normalize_oracles.py --check

      - name: Fetch pinned CTS snapshot
        run: |
          set -euo pipefail
          scripts/parity/fetch_cts.sh

      - name: Refresh CTS index
        run: |
          set -euo pipefail
          python3 scripts/parity/index_cts.py
          git diff --exit-code -- test/parity/generated/cts_index.tsv

      - name: Check generated parity artifacts
        run: |
          set -euo pipefail
          python3 scripts/parity/generate_manifest.py \
            --manifest test/parity/manifest.tsv \
            --rules test/parity/rules.tsv \
            --cts-index test/parity/generated/cts_index.tsv \
            --output-candidates test/parity/generated/cts_manifest_candidates.tsv \
            --output-wgsl-rules test/parity/generated/wgsl_rule_index.tsv \
            --output-wesl-rules test/parity/generated/wesl_rule_index.tsv \
            --check

      - name: Check CTS backlog promotion is up to date
        run: |
          set -euo pipefail
          python3 scripts/parity/verify_idempotent.py \
            --path test/parity/manifest.tsv \
            --path test/parity/rules.tsv \
            -- python3 scripts/parity/promote_cts_backlog.py

      - name: Check CTS backlog fixtures are materialized
        run: |
          set -euo pipefail
          python3 scripts/parity/verify_idempotent.py \
            --path test/parity/manifest.tsv \
            --path test/parity/fixtures/cts_backlog \
            -- python3 scripts/parity/materialize_cts_backlog_fixtures.py

  test:
    needs: parity-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghc: '9.12.2'
            cabal: '3.14.1.1'
            validators: true
          - ghc: '9.14.1'
            cabal: '3.16.1.0'
            validators: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Haskell
        uses: haskell-actions/setup@33d9e1bb5b321fa8d6de86d9e9bbc251b4690b80 # v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Cache Cabal artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('spirdo.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Setup Rust
        if: matrix.validators
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install validators
        if: matrix.validators
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y spirv-tools
          cargo install naga-cli --locked --version 28.0.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Refresh cabal index
        run: cabal update

      - name: Build
        run: cabal build all --enable-tests --enable-benchmarks

      - name: Test (validators required)
        if: matrix.validators
        env:
          SPIRDO_REQUIRE_VALIDATORS: '1'
        run: cabal test --enable-tests

      - name: Test
        if: ${{ !matrix.validators }}
        run: cabal test --enable-tests

      - name: Benchmark fixture smoke test
        if: matrix.validators
        env:
          SPIRDO_BENCH_ITERS: '1'
        run: cabal bench spirdo-compile-bench

      - name: Check source distribution
        run: |
          set -euo pipefail
          cabal check
          sdist_dir="$(mktemp -d)"
          trap 'rm -rf "$sdist_dir"' EXIT
          index_state="$(awk '/^index-state:/ { print $2 }' cabal.project)"
          test -n "$index_state"
          cabal sdist --output-directory="$sdist_dir"
          tarball="$(find "$sdist_dir" -maxdepth 1 -name 'spirdo-*.tar.gz' -print -quit)"
          test -n "$tarball"
          tar -xzf "$tarball" -C "$sdist_dir"
          package_dir="$(find "$sdist_dir" -mindepth 1 -maxdepth 1 -type d -name 'spirdo-*' -print -quit)"
          test -n "$package_dir"
          (
            cd "$package_dir"
            cabal build all --enable-tests --index-state="$index_state"
            cabal test spirdo-tests --enable-tests --index-state="$index_state"
          )

  examples:
    needs: parity-lint
    # Ubuntu 26.04 provides SDL3 >= 3.4; SDL3_mixer is built below because it is not yet packaged.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Haskell
        uses: haskell-actions/setup@33d9e1bb5b321fa8d6de86d9e9bbc251b4690b80 # v2
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.16.1.0'

      - name: Install SDL3 development packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ffmpeg \
            libsdl3-dev \
            libsdl3-image-dev \
            mesa-vulkan-drivers \
            pkg-config \
            libsdl3-ttf-dev \
            xvfb

      - name: Build pinned SDL3_mixer dependency
        run: |
          set -euo pipefail
          mixer_dir="$(mktemp -d)"
          mixer_prefix="$RUNNER_TEMP/sdl3-mixer"
          trap 'rm -rf "$mixer_dir"' EXIT
          git init "$mixer_dir"
          git -C "$mixer_dir" remote add origin https://github.com/libsdl-org/SDL_mixer.git
          git -C "$mixer_dir" fetch --depth=1 origin 72a81869b45e249e8e67102db4e98dd2441f05a1
          git -C "$mixer_dir" checkout --detach FETCH_HEAD
          cmake -S "$mixer_dir" -B "$mixer_dir/build" \
            -DCMAKE_INSTALL_PREFIX="$mixer_prefix" \
            -DSDLMIXER_INSTALL=ON \
            -DSDLMIXER_VENDORED=OFF
          cmake --build "$mixer_dir/build" --parallel
          cmake --install "$mixer_dir/build"
          mixer_pc="$(find "$mixer_prefix" -name sdl3-mixer.pc -print -quit)"
          mixer_library="$(find "$mixer_prefix" -name 'libSDL3_mixer.so.0*' -print -quit)"
          test -n "$mixer_pc"
          test -n "$mixer_library"
          mixer_pc_dir="$(dirname "$mixer_pc")"
          mixer_library_dir="$(dirname "$mixer_library")"
          echo "PKG_CONFIG_PATH=$mixer_pc_dir${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$mixer_library_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$mixer_pc_dir${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
            pkg-config --atleast-version=3.2 sdl3-mixer

      - name: Refresh Cabal index
        working-directory: examples
        run: cabal update

      - name: Build bundled examples from source distribution
        run: |
          set -euo pipefail
          sdist_dir="$RUNNER_TEMP/spirdo-sdist"
          mkdir -p "$sdist_dir"
          cabal sdist --output-directory="$sdist_dir"
          tarball="$(find "$sdist_dir" -maxdepth 1 -name 'spirdo-*.tar.gz' -print -quit)"
          test -n "$tarball"
          tar -xzf "$tarball" -C "$sdist_dir"
          package_dir="$(find "$sdist_dir" -mindepth 1 -maxdepth 1 -type d -name 'spirdo-*' -print -quit)"
          test -n "$package_dir"
          echo "SPIRDO_PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"
          (
            cd "$package_dir/examples"
            cabal build --project-file=cabal.project --enable-tests all
            cabal test --project-file=cabal.project spirdo-game-tests
          )

      - name: Capture game with Lavapipe
        run: |
          set -euo pipefail
          cd "$SPIRDO_PACKAGE_DIR"
          lavapipe_icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$lavapipe_icd"
          SPIRDO_VULKAN_ICD="$lavapipe_icd" \
            timeout --kill-after=15s 60s bash scripts/capture_game.sh /tmp/spirdo-game.png \
              2>&1 | tee /tmp/spirdo-game-capture.log
          test -s /tmp/spirdo-game.png

      - name: Upload game capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spirdo-game-capture
          path: |
            /tmp/spirdo-game.png
            /tmp/spirdo-game-capture.log
          if-no-files-found: ignore
